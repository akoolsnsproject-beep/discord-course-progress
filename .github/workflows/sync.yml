name: 進み具合の更新（GitHub は最後の予備）

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分。Windows も Mac も止まっているときだけ作業する（sync.py が判断）
  workflow_dispatch: {}

concurrency:
  group: course-progress
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest   # GitHub のクラウド。threads-autopost のランナーは使わない
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python sync.py --role github
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
